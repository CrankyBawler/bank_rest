#
# application.yml — главный конфигурационный файл Spring Boot.

spring:
  application:
    name: bank-cards-system

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_cards_db
    username: postgres
    password: 663259
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true


  security:
    jwt:
      secret: yourStrongSecretKeyForJWTSigningMustBeAtLeast32CharsLong!
      expiration-ms: 86400000


server:
  port: 8080
  servlet:
    context-path: /api


logging:
  level:
    com.example.bankcards: DEBUG
    org.springframework.security: INFO
    liquibase: INFO


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha